name: Report a false positive
description: sloplint flagged text that is fine.
title: '[false positive] '
labels: ['false-positive', 'triage']
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: vocab/hype-adjectives
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Text that was flagged
      description: The smallest input that reproduces it.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this fine?
      description: For example, a technical term, a quote, a proper noun, or code that was not masked.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sloplint version
      placeholder: output of `npx sloplint --version`
